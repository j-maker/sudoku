# Paquete en Play Store, AdMob y Firebase (debe coincidir en google-services.json)
applicationId=com.jmaker.sudoku 

# Analytics (GA4): filtro por app_slug — único por cada app del mismo proyecto Firebase
# Prefijo de eventos GA4: sudoku_puzzle_complete, sudoku_screen_view, etc.
appSlug=sudoku
appDisplayName=Sudoku

# Versión en Play Console
versionCode=1
versionName=1.0.0
